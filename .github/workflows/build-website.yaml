name: Build and Deploy Website

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # Skip closed PRs (handled by cleanup-preview) and fork PRs (no write token).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Serialize every job that pushes to gh-pages so they don't reject each other.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Define variables
        run: |
          BRANCH_NAME_TRIMMED=$(printf '%s' "$BRANCH_NAME" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          VERSION_NAME=$(printf '%s' "$BRANCH_NAME_TRIMMED" | tr -c '[:alnum:]-' '-' | sed -E 's/-{2,}/-/g; s/^-+//; s/-+$//')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Update mkdocs.yml
        run: |
          sed -i "s|edit_uri: edit/main/docs/|edit_uri: edit/$VERSION_NAME/docs/|" mkdocs.yml
          if [ "$BRANCH_NAME" = "main" ]; then
            sed -i "s/version_selector: true/version_selector: false/" mkdocs.yml
          fi

      - name: Deploy docs with mike
        run: |
          if [ "$BRANCH_NAME" = "main" ]; then
            uv run mike deploy --push "$VERSION_NAME" latest
            uv run mike set-default --push latest
          else
            uv run mike deploy --push "$VERSION_NAME"
          fi
      - name: Check if message already exists
        if: github.event_name == 'pull_request'
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "🧪🎉 This version of the website will be available shortly at: "
      - name: Add comment to PR
        if: github.event_name == 'pull_request' && steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🧪🎉 This version of the website will be available shortly at: https://guide.cioos.ca/${{ env.VERSION_NAME }}

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      BRANCH_NAME: ${{ github.head_ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Define variables
        run: |
          BRANCH_NAME_TRIMMED=$(printf '%s' "$BRANCH_NAME" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          VERSION_NAME=$(printf '%s' "$BRANCH_NAME_TRIMMED" | tr -c '[:alnum:]-' '-' | sed -E 's/-{2,}/-/g; s/^-+//; s/-+$//')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
      - name: Delete preview with mike
        run: |
          # The preview may never have been deployed (e.g. its build failed).
          if uv run mike list --json | jq -e --arg v "$VERSION_NAME" 'any(.[]; .version == $v)' > /dev/null; then
            uv run mike delete --push "$VERSION_NAME"
          else
            echo "No preview version '$VERSION_NAME' to delete."
          fi
